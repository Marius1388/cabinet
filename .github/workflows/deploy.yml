name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Override these with repository variables if your FTP layout differs
      SITE_DIR: ${{ vars.FTP_SITE_DIR || '/public_html' }}
      API_DIR: ${{ vars.FTP_API_DIR || '/cabinet-api' }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_HOST: ${{ secrets.FTP_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Install lftp
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp

      # The static site goes to the document root. .htaccess is excluded so
      # the CloudLinux Passenger block written by "Setup Node.js App" (which
      # routes /api to the Node app) is never wiped by a deploy.
      - name: Upload static site
        run: |
          lftp -e "
            set ssl:verify-certificate no;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST;
            mirror -R --delete --exclude-glob .htaccess dist/ $SITE_DIR;
            bye
          "

      # The contact API source goes to the Node app root (outside the
      # document root). node_modules, .env and tmp/ live only on the server.
      - name: Upload contact API
        run: |
          lftp -e "
            set ssl:verify-certificate no;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST;
            mirror -R --delete --exclude-glob node_modules/ --exclude-glob .env --exclude-glob tmp/ api/ $API_DIR;
            bye
          "

      # Touching tmp/restart.txt makes Passenger reload the app with the
      # newly uploaded code — no manual restart needed in cPanel.
      - name: Restart Node app
        run: |
          date > restart.txt
          lftp -e "
            set ssl:verify-certificate no;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST;
            mkdir -p $API_DIR/tmp;
            put -O $API_DIR/tmp restart.txt;
            bye
          "

      - name: Done
        run: |
          echo "Static site deployed to $SITE_DIR, API to $API_DIR."
          echo "If api/package.json changed, run 'NPM Install' once in cPanel > Setup Node.js App."
